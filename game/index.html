<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — a lunch-rush cooking game</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="stage-wrap">
  <canvas id="game" aria-label="Sizzle and Serve: run the lunch rush. Grill patties, fry fries, chop vegetables, stack dishes on the plate and serve orders before their patience runs out."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="hint">Click ingredients or press 1–6 &nbsp;•&nbsp; Space serves &nbsp;•&nbsp; C clears the plate &nbsp;•&nbsp; P pauses &nbsp;•&nbsp; M mutes</p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
